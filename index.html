<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="毛泽东思想和中国特色社会主义理论体系概论练习系统">
  <title>毛概答题系统</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #1a1a2e;
      --card: #16213e;
      --primary: #00d4ff;
      --secondary: #0f3460;
      --text: #e4e4e7;
      --text-dim: #a1a1aa;
      --correct: #22c55e;
      --wrong: #ef4444;
      --safe: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(20px + var(--safe));
      overflow-x: hidden;
    }
    .container { max-width: 480px; margin: 0 auto; padding: 16px; }
    
    /* 设置页 */
    .page { display: none; }
    .page.active { display: block; }
    .header {
      text-align: center;
      padding: 24px 0;
      border-bottom: 1px solid var(--secondary);
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .header p { color: var(--text-dim); font-size: 14px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 16px;
      color: var(--primary);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--secondary);
    }
    .form-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--secondary);
    }
    .form-item:last-child { border-bottom: none; }
    .form-item label { font-size: 15px; }
    .form-item input[type="number"] {
      width: 70px;
      padding: 8px 12px;
      border: 1px solid var(--secondary);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      text-align: center;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #0099cc);
      color: var(--bg);
    }
    .btn-primary:active { transform: scale(0.98); }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
    }
    .checkbox-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: var(--primary);
    }
    .mode-select {
      display: flex;
      gap: 12px;
    }
    .mode-btn {
      flex: 1;
      padding: 16px;
      background: var(--secondary);
      border: 2px solid var(--secondary);
      border-radius: 12px;
      color: var(--text);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      border-color: var(--primary);
      background: rgba(0,212,255,0.1);
    }
    .mode-btn h4 { margin-bottom: 4px; font-size: 15px; }
    .mode-btn p { font-size: 12px; color: var(--text-dim); }
    .type-score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--secondary);
    }
    .type-score-row:last-child { border-bottom: none; }
    .type-name { display: flex; align-items: center; gap: 8px; }
    .type-badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .type-badge.single { background: #3b82f6; }
    .type-badge.multi { background: #f59e0b; }
    .type-badge.judge { background: #10b981; }
    
    /* 答题页 */
    .bg-decoration {
      position: fixed;
      right: 10px;
      bottom: calc(20px + var(--safe));
      width: 100px;
      height: 120px;
      z-index: 0;
      pointer-events: none;
    }
    .bg-decoration svg {
      width: 100%;
      height: 100%;
      opacity: 0.5;
    }
    #quizPage .container {
      position: relative;
      z-index: 1;
    }
    .progress-bar {
      background: var(--secondary);
      height: 6px;
      border-radius: 3px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-fill {
      background: var(--primary);
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s;
    }
    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .question-type {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
    }
    .question-type.single { background: rgba(59,130,246,0.2); color: #3b82f6; }
    .question-type.multi { background: rgba(245,158,11,0.2); color: #f59e0b; }
    .question-type.judge { background: rgba(16,185,129,0.2); color: #10b981; }
    .question-right { display: flex; gap: 12px; align-items: center; }
    .question-id, .question-score {
      color: var(--text-dim);
      font-size: 13px;
      background: var(--secondary);
      padding: 4px 10px;
      border-radius: 12px;
    }
    .question-text {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
      padding: 16px;
      background: var(--secondary);
      border-radius: 12px;
      border-left: 4px solid var(--primary);
      word-break: break-all;
    }
    .multi-tip {
      font-size: 13px;
      color: #f59e0b;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: rgba(245,158,11,0.1);
      border-radius: 8px;
    }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      display: flex;
      align-items: center;
      padding: 16px;
      background: var(--card);
      border: 2px solid var(--secondary);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 56px;
    }
    .option:active { transform: scale(0.98); }
    .option.selected {
      border-color: var(--primary);
      background: rgba(0, 212, 255, 0.1);
    }
    .option.correct {
      border-color: var(--correct);
      background: rgba(34, 197, 94, 0.15);
    }
    .option.wrong {
      border-color: var(--wrong);
      background: rgba(239, 68, 68, 0.15);
    }
    .option-letter {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--secondary);
      border-radius: 8px;
      font-weight: 600;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .option.selected .option-letter { background: var(--primary); color: var(--bg); }
    .option.correct .option-letter { background: var(--correct); color: white; }
    .option.wrong .option-letter { background: var(--wrong); color: white; }
    .option-text { font-size: 15px; line-height: 1.5; flex: 1; word-break: break-all; }
    .nav-btns { display: flex; gap: 12px; margin-top: 20px; }
    .btn-nav {
      flex: 1;
      padding: 14px;
      background: var(--secondary);
      color: var(--text);
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-nav.confirm {
      background: var(--primary);
      color: var(--bg);
    }
    
    /* 解析 */
    .explanation {
      margin-top: 16px;
      padding: 16px;
      background: var(--secondary);
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.8;
      display: none;
      word-break: break-all;
    }
    .explanation.show { display: block; }
    .explanation strong { color: var(--primary); }
    
    /* 结果页 */
    .score-card {
      text-align: center;
      padding: 32px 20px;
      background: var(--card);
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .score-num {
      font-size: 72px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--correct));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .score-detail { color: var(--text-dim); margin-top: 8px; font-size: 15px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-item {
      background: var(--card);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-num { font-size: 24px; font-weight: 700; }
    .stat-num.correct { color: var(--correct); }
    .stat-num.wrong { color: var(--wrong); }
    .stat-num.skip { color: var(--text-dim); }
    .stat-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
    
    /* 提示弹窗 */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      color: white;
      padding: 20px 32px;
      border-radius: 12px;
      font-size: 16px;
      z-index: 1000;
      display: none;
    }
    .toast.show { display: block; animation: fadeIn 0.2s; }
    @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); } }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  
  <!-- 设置页 -->
  <div id="setupPage" class="page active">
    <div class="container">
      <div class="header">
        <h1>📚 毛概答题系统</h1>
        <p>毛泽东思想和中国特色社会主义理论体系概论</p>
      </div>
      <div class="card">
        <div class="card-title">🎯 选择模式</div>
        <div class="mode-select">
          <div class="mode-btn active" id="modePractice" onclick="setMode('practice')">
            <h4>刷题自测</h4>
            <p>做一题看一题</p>
          </div>
          <div class="mode-btn" id="modeExam" onclick="setMode('exam')">
            <h4>模拟自测</h4>
            <p>全部做完再看</p>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">📋 抽题数量</div>
        <div class="form-item">
          <label>单选题</label>
          <input type="number" id="singleNum" value="10" min="0">
        </div>
        <div class="form-item">
          <label>多选题</label>
          <input type="number" id="multiNum" value="5" min="0">
        </div>
        <div class="form-item">
          <label>判断题</label>
          <input type="number" id="judgeNum" value="5" min="0">
        </div>
      </div>
      <div class="card">
        <div class="card-title">💰 每题分值</div>
        <div class="type-score-row">
          <div class="type-name">
            <span class="type-badge single">单选</span>
            <span>单选题</span>
          </div>
          <input type="number" id="scoreSingle" value="5" min="0.5" step="0.5">
        </div>
        <div class="type-score-row">
          <div class="type-name">
            <span class="type-badge multi">多选</span>
            <span>多选题</span>
          </div>
          <input type="number" id="scoreMulti" value="10" min="0.5" step="0.5">
        </div>
        <div class="type-score-row">
          <div class="type-name">
            <span class="type-badge judge">判断</span>
            <span>判断题</span>
          </div>
          <input type="number" id="scoreJudge" value="5" min="0.5" step="0.5">
        </div>
      </div>
      <div class="card">
        <div class="card-title">⚙️ 其他设置</div>
        <div class="form-item">
          <label>显示解析</label>
          <input type="checkbox" id="showExp" checked>
        </div>
      </div>
      <div class="card">
        <div class="card-title">📊 题库统计</div>
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-num" id="statSingle">0</div>
            <div class="stat-label">单选题</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="statMulti">0</div>
            <div class="stat-label">多选题</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="statJudge">0</div>
            <div class="stat-label">判断题</div>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="startQuiz()">开始答题</button>
    </div>
  </div>
  
  <!-- 答题页 -->
  <div id="quizPage" class="page">
    <div class="bg-decoration">
      <img src="girl.png" alt="" />
    </div>
    <div class="container">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="question-header">
        <span class="question-type" id="qType"></span>
        <div class="question-right">
          <span class="question-id" id="qNum"></span>
          <span class="question-score" id="qScore"></span>
        </div>
      </div>
      <div class="question-text" id="qText"></div>
      <div id="multiTip" class="multi-tip" style="display:none;">💡 这是多选题，可选择多个答案</div>
      <div class="options" id="options"></div>
      <div class="explanation" id="explanation"></div>
      <div class="nav-btns">
        <button class="btn-nav" id="prevBtn" onclick="prevQ()">上一题</button>
        <button class="btn-nav confirm" id="nextBtn" onclick="nextQ()">下一题</button>
      </div>
    </div>
  </div>
  
  <!-- 结果页 -->
  <div id="resultPage" class="page">
    <div class="container">
      <div class="score-card">
        <div class="score-num" id="finalScore">0</div>
        <div class="score-detail">总分 <span id="totalScore">0</span> 分</div>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-num correct" id="correctNum">0</div>
          <div class="stat-label">答对</div>
        </div>
        <div class="stat-item">
          <div class="stat-num wrong" id="wrongNum">0</div>
          <div class="stat-label">答错</div>
        </div>
        <div class="stat-item">
          <div class="stat-num skip" id="skipNum">0</div>
          <div class="stat-label">未答</div>
        </div>
      </div>
      <div class="card" id="wrongListCard" style="display:none;">
        <div class="card-title">📝 错题回顾</div>
        <div id="wrongList"></div>
      </div>
      <button class="btn btn-primary" onclick="restart()">再练一次</button>
    </div>
  </div>

  <script src="bank.js"></script>
  <script>
    let quizQuestions = [];
    let currentIdx = 0;
    let userAnswers = [];
    let quizMode = 'practice';
    let showExp = true;
    let scoreSingle = 5, scoreMulti = 10, scoreJudge = 5;
    let singles, multis, judges;
    
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
    
    function setMode(mode) {
      quizMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      if (mode === 'practice') {
        document.getElementById('modePractice').classList.add('active');
      } else {
        document.getElementById('modeExam').classList.add('active');
      }
    }
    
    function init() {
      singles = BANK.filter(q => q.type === 'single');
      multis = BANK.filter(q => q.type === 'multiple');
      judges = BANK.filter(q => q.type === 'judge');
      document.getElementById('statSingle').textContent = singles.length;
      document.getElementById('statMulti').textContent = multis.length;
      document.getElementById('statJudge').textContent = judges.length;
      
      document.getElementById('singleNum').max = singles.length;
      document.getElementById('multiNum').max = multis.length;
      document.getElementById('judgeNum').max = judges.length;
    }
    
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    
    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
    
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1500);
    }
    
    function getScore(type) {
      if (type === 'single') return scoreSingle;
      if (type === 'multiple') return scoreMulti;
      return scoreJudge;
    }
    
    function startQuiz() {
      const singleN = parseInt(document.getElementById('singleNum').value) || 0;
      const multiN = parseInt(document.getElementById('multiNum').value) || 0;
      const judgeN = parseInt(document.getElementById('judgeNum').value) || 0;
      
      scoreSingle = parseFloat(document.getElementById('scoreSingle').value) || 5;
      scoreMulti = parseFloat(document.getElementById('scoreMulti').value) || 10;
      scoreJudge = parseFloat(document.getElementById('scoreJudge').value) || 5;
      showExp = document.getElementById('showExp').checked;
      
      if (singleN > singles.length) { showToast('单选题题数不足'); return; }
      if (multiN > multis.length) { showToast('多选题题数不足'); return; }
      if (judgeN > judges.length) { showToast('判断题题数不足'); return; }
      
      if (singleN + multiN + judgeN === 0) {
        showToast('请至少选择一种题型');
        return;
      }
      
      quizQuestions = [];
      if (singleN > 0) quizQuestions.push(...shuffle([...singles]).slice(0, singleN));
      if (multiN > 0) quizQuestions.push(...shuffle([...multis]).slice(0, multiN));
      if (judgeN > 0) quizQuestions.push(...shuffle([...judges]).slice(0, judgeN));
      
      quizQuestions = shuffle(quizQuestions);
      userAnswers = new Array(quizQuestions.length).fill(null);
      currentIdx = 0;
      showPage('quizPage');
      renderQuestion();
    }
    
    function getTypeName(type) {
      const names = { single: '单选题', multiple: '多选题', judge: '判断题' };
      return names[type] || type;
    }
    
    function renderQuestion() {
      const q = quizQuestions[currentIdx];
      if (!q) { console.error('No question at index:', currentIdx); return; }
      
      const typeEl = document.getElementById('qType');
      if (!typeEl) { console.error('Element qType not found'); return; }
      typeEl.textContent = getTypeName(q.type);
      typeEl.className = 'question-type ' + q.type;
      
      const qScoreEl = document.getElementById('qScore');
      if (qScoreEl) qScoreEl.textContent = `${getScore(q.type)}分`;
      
      const qNumEl = document.getElementById('qNum');
      if (qNumEl) qNumEl.textContent = `${currentIdx + 1} / ${quizQuestions.length}`;
      
      const progressEl = document.getElementById('progressFill');
      if (progressEl) progressEl.style.width = `${((currentIdx + 1) / quizQuestions.length) * 100}%`;
      
      const qTextEl = document.getElementById('qText');
      if (qTextEl) qTextEl.textContent = q.question;
      
      const isMulti = q.type === 'multiple';
      const multiTipEl = document.getElementById('multiTip');
      if (multiTipEl) multiTipEl.style.display = isMulti ? 'block' : 'none';
      
      const optDiv = document.getElementById('options');
      if (!optDiv) { console.error('Element options not found'); return; }
      optDiv.innerHTML = '';
      
      const letters = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        
        const currentAnswer = userAnswers[currentIdx];
        
        if (quizMode === 'practice' && currentAnswer !== null) {
          if (q.answer.includes(i)) div.classList.add('correct');
          else if (currentAnswer.includes ? currentAnswer.includes(i) : currentAnswer === i) div.classList.add('wrong');
        } else if (currentAnswer !== null && (currentAnswer.includes ? currentAnswer.includes(i) : currentAnswer === i)) {
          div.classList.add('selected');
        }
        
        div.innerHTML = `<span class="option-letter">${letters[i]}</span><span class="option-text">${opt}</span>`;
        
        if (isMulti) {
          div.onclick = () => toggleMultiOption(i);
        } else {
          div.onclick = () => selectOption(i);
        }
        
        optDiv.appendChild(div);
      });
      
      const expDiv = document.getElementById('explanation');
      if (expDiv) {
        if (quizMode === 'practice' && userAnswers[currentIdx] !== null && showExp) {
          expDiv.innerHTML = q.explanation.replace(/\n/g, '<br>');
          expDiv.classList.add('show');
        } else {
          expDiv.classList.remove('show');
        }
      }
      
      const prevBtn = document.getElementById('prevBtn');
      if (prevBtn) prevBtn.style.visibility = currentIdx > 0 ? 'visible' : 'hidden';
      
      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) nextBtn.textContent = currentIdx === quizQuestions.length - 1 ? '查看成绩' : '下一题';
    }
    
    function selectOption(idx) {
      if (quizMode === 'practice' && userAnswers[currentIdx] !== null) return;
      userAnswers[currentIdx] = idx;
      renderQuestion();
    }
    
    function toggleMultiOption(idx) {
      if (quizMode === 'practice' && userAnswers[currentIdx] !== null) return;
      if (userAnswers[currentIdx] === null) {
        userAnswers[currentIdx] = [];
      }
      const arr = userAnswers[currentIdx];
      const pos = arr.indexOf(idx);
      if (pos > -1) {
        arr.splice(pos, 1);
      } else {
        arr.push(idx);
      }
      userAnswers[currentIdx] = arr;
      renderQuestion();
    }
    
    function nextQ() {
      if (userAnswers[currentIdx] === null || (Array.isArray(userAnswers[currentIdx]) && userAnswers[currentIdx].length === 0)) {
        showToast('请至少选择一个答案');
        return;
      }
      if (currentIdx < quizQuestions.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        showResult();
      }
    }
    
    function prevQ() {
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
      }
    }
    
    function isAnswerCorrect(q, answer) {
      if (Array.isArray(answer)) {
        if (answer.length !== q.answer.length) return false;
        return q.answer.every(a => answer.includes(a));
      }
      return q.answer.includes(answer);
    }
    
    function showResult() {
      let correct = 0, wrong = 0, skip = 0;
      let totalScore = 0, maxScore = 0;
      const wrongList = [];
      
      quizQuestions.forEach((q, i) => {
        const qScore = getScore(q.type);
        maxScore += qScore;
        
        if (userAnswers[i] === null || (Array.isArray(userAnswers[i]) && userAnswers[i].length === 0)) {
          skip++;
        } else if (isAnswerCorrect(q, userAnswers[i])) {
          correct++;
          totalScore += qScore;
        } else {
          wrong++;
          wrongList.push({ q, i, userAns: userAnswers[i] });
        }
      });
      
      const finalScoreEl = document.getElementById('finalScore');
      if (finalScoreEl) finalScoreEl.textContent = totalScore.toFixed(1);
      
      const totalScoreEl = document.getElementById('totalScore');
      if (totalScoreEl) totalScoreEl.textContent = maxScore.toFixed(1);
      
      document.getElementById('correctNum').textContent = correct;
      document.getElementById('wrongNum').textContent = wrong;
      document.getElementById('skipNum').textContent = skip;
      
      const wrongListDiv = document.getElementById('wrongList');
      const wrongListCard = document.getElementById('wrongListCard');
      if (wrongList.length > 0 && wrongListDiv && wrongListCard) {
        wrongListCard.style.display = 'block';
        wrongListDiv.innerHTML = '';
        wrongList.forEach((item, idx) => {
          const q = item.q;
          const letters = ['A', 'B', 'C', 'D'];
          const div = document.createElement('div');
          div.style.padding = '12px 0';
          div.style.borderBottom = idx < wrongList.length - 1 ? '1px solid var(--secondary)' : 'none';
          let opts = q.options.map((o, i) => {
            let cls = '';
            if (q.answer.includes(i)) cls = ' style="color:var(--correct)"';
            return `<div${cls}>${letters[i]}. ${o}</div>`;
          }).join('');
          const userAnsStr = Array.isArray(item.userAns) ? item.userAns.map(x => letters[x]).join(',') : (item.userAns !== null ? letters[item.userAns] : '未答');
          const correctAnsStr = q.answer.map(x => letters[x]).join(',');
          div.innerHTML = `
            <div style="margin-bottom:8px;"><strong>${item.i + 1}. ${q.question}</strong></div>
            <div style="font-size:14px;line-height:1.6;">${opts}</div>
            <div style="margin-top:8px;font-size:13px;color:var(--text-dim);">
              你的答案：${userAnsStr} | 正确答案：${correctAnsStr}
            </div>
            ${showExp ? `<div style="margin-top:8px;font-size:13px;line-height:1.6;background:var(--secondary);padding:10px;border-radius:8px;word-break:break-all;">${q.explanation.replace(/\n/g, '<br>')}</div>` : ''}
          `;
          wrongListDiv.appendChild(div);
        });
      } else if (wrongListCard) {
        wrongListCard.style.display = 'none';
      }
      
      showPage('resultPage');
    }
    
    function restart() {
      showPage('setupPage');
    }
    
    init();
  </script>
</body>
</html>
